# Builds the Android app (android-app/) and puts the APK on the "android-latest" release, so a phone can install it
# from one link: https://github.com/ReikenZ7-Coding/Street-Mandarin/releases/download/android-latest/street-mandarin.apk
name: Android app
on:
  push:
    branches: [android-app, main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Check the app's own code first
        run: node tools/check-syntax.js && node -e "require('./ai.js')"
      - name: Make the Android project
        working-directory: android-app
        run: |
          npm ci --no-audit --no-fund
          SM_WEB_V=${{ github.run_number }} node build-www.js
          npx cap add android
          npm run icons
          npx cap sync android
          # each build installs over the last one, so progress on the phone is kept
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle
      - name: Build the APK
        working-directory: android-app/android
        run: |
          # a fixed test key, so one build can replace another (a store release would use a private key instead)
          mkdir -p ~/.android && cp ../debug.keystore ~/.android/debug.keystore
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../street-mandarin.apk
          ls -la ../../street-mandarin.apk
      - uses: actions/upload-artifact@v4
        with:
          name: street-mandarin-apk
          path: street-mandarin.apk
      - name: Put it on the android-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Built from ${GITHUB_REF_NAME} at ${GITHUB_SHA::7}. On your phone: open this page, tap street-mandarin.apk, then allow installing from your browser if Android asks."
          if gh release view android-latest >/dev/null 2>&1; then
            gh release edit android-latest --notes "$notes" --prerelease
            gh release upload android-latest street-mandarin.apk --clobber
          else
            gh release create android-latest street-mandarin.apk --title "Street Mandarin for Android (test build)" --notes "$notes" --prerelease --target "$GITHUB_SHA"
          fi

      - name: Put the app's files there too, so installed apps update themselves
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # only files no earlier version had, then web.json (the list phones check) last; unused files are removed
          gh release view android-latest --json assets --jq '.assets[].name' > have.txt
          node android-app/publish-web.js < have.txt
          if [ -n "$(ls up)" ]; then gh release upload android-latest up/*; fi
          gh release upload android-latest android-app/www/web.json --clobber
          grep '^w-' have.txt | grep -vxFf want.txt | while read -r n; do gh release delete-asset android-latest "$n" -y; done || true
