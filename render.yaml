# Render Blueprint: one free web service. The database is a free Neon Postgres (see README).
services:
  - type: web
    name: street-mandarin
    runtime: node
    plan: free
    buildCommand: cd server && npm ci --omit=dev
    startCommand: cd server && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: AI_MODE
        value: byok
      - key: APP_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
