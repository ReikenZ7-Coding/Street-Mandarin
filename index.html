<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Street Mandarin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500&family=Noto+Serif+SC:wght@600;900&display=swap">
<style>
/* Layout: scenario rail | live scene (conversation + your move) | 错题本 mistake notebook. Stacks to one column on phones. */
:root {
  --bg: #e9eeeb;
  --surface: #f9fbfa;
  --surface-2: #dfe6e2;
  --fg: #13201c;
  --muted: #56665f;
  --line: #c9d3ce;
  --cinnabar: #b8321d;
  --cinnabar-soft: #f6dcd5;
  --ochre: #94600c;
  --ochre-soft: #f3e6c9;
  --jade: #0c6e53;
  --jade-soft: #d3ebe2;
  --npc: #ffffff;
  --me: #13201c;
  --me-fg: #eef3f0;
  --f-ui: "Familjen Grotesk", "Helvetica Neue", Arial, sans-serif;
  --f-han: "Noto Serif SC", "Songti SC", "SimSun", serif;
  --f-py: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1412; --surface: #141d1a; --surface-2: #1c2723; --fg: #e4ebe7; --muted: #93a39c; --line: #2a3833;
    --cinnabar: #f0654d; --cinnabar-soft: #3a1c16; --ochre: #e0a640; --ochre-soft: #352812;
    --jade: #43c099; --jade-soft: #12302a; --npc: #1b2622; --me: #d9e4df; --me-fg: #101815;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1412; --surface: #141d1a; --surface-2: #1c2723; --fg: #e4ebe7; --muted: #93a39c; --line: #2a3833;
  --cinnabar: #f0654d; --cinnabar-soft: #3a1c16; --ochre: #e0a640; --ochre-soft: #352812;
  --jade: #43c099; --jade-soft: #12302a; --npc: #1b2622; --me: #d9e4df; --me-fg: #101815;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-ui); font-size: 15px; line-height: 1.5; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--jade); outline-offset: 2px; }
.wrap { max-width: 1320px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 40px; }

header.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; margin-bottom: 20px; }
.brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.brand h1 { margin: 0; font-family: var(--f-han); font-weight: 900; font-size: 30px; letter-spacing: 0.02em; }
.brand .en { font-weight: 700; font-size: 18px; }
.tagline { margin: 4px 0 0; color: var(--muted); max-width: 60ch; }
.streak { margin: 6px 0 0; font-size: 13px; color: var(--jade); font-weight: 600; min-height: 1em; }
.streak .zh { font-family: var(--f-han); margin-right: 6px; }
.toggles { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 500; }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }

.layout { display: grid; grid-template-columns: 250px minmax(0, 1fr) 300px; gap: 20px; align-items: start; }
@media (max-width: 1150px) { .layout { grid-template-columns: 230px minmax(0, 1fr); } .notebook { grid-column: 1 / -1; } }
@media (max-width: 760px) { .layout { grid-template-columns: minmax(0, 1fr); } }

/* Scenario rail */
.rail { display: flex; flex-direction: column; gap: 8px; }
.rail-group { font-size: 12px; color: var(--muted); margin: 8px 2px 0; font-weight: 600; }
.rail h2, .notebook h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin: 0 0 4px; font-weight: 600; }
.scn { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 12px; display: grid; grid-template-columns: auto minmax(0,1fr); gap: 2px 12px; align-items: center; }
.scn .han { font-family: var(--f-han); font-weight: 900; font-size: 26px; grid-row: span 2; line-height: 1; }
.scn .name { font-weight: 600; }
.scn .meta { font-size: 12px; color: var(--muted); }
.scn[aria-current="true"] { border-color: var(--fg); box-shadow: inset 3px 0 0 var(--cinnabar); }
.scn .done { color: var(--jade); font-weight: 600; }
.marks { display: inline-flex; gap: 3px; vertical-align: middle; margin-right: 4px; }
.marks i { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--jade); }
.marks i.on { background: var(--jade); }
.outcome .gain { color: var(--jade); font-weight: 600; }
@media (max-width: 760px) {
  .rail { flex-direction: row; overflow-x: auto; padding-bottom: 4px; }
  .rail h2, .rail .rail-group { display: none; }
  .scn { flex: 0 0 auto; min-width: 150px; }
}

/* Scene */
.scene { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; min-width: 0; }
.scene-head { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 18px; padding: 18px 20px; border-bottom: 1px solid var(--line); background: var(--surface-2); }
.place { font-family: var(--f-han); font-weight: 900; font-size: 56px; line-height: 1; grid-row: span 3; align-self: center; }
.place-py { font-family: var(--f-py); color: var(--muted); font-size: 14px; }
.place-en { font-weight: 700; font-size: 20px; line-height: 1.2; }
.goal { font-size: 14px; }
.goal b { font-weight: 600; }
@media (max-width: 480px) { .place { font-size: 42px; } }

.log { padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; max-height: min(62vh, 620px); min-height: 220px; overflow-y: auto; }
.narr { color: var(--muted); font-style: italic; font-size: 14px; max-width: 60ch; }
.row { display: flex; gap: 10px; align-items: flex-end; }
.row.me { justify-content: flex-end; }
.who { flex: 0 0 auto; width: 38px; height: 38px; border-radius: 50%; background: var(--fg); color: var(--bg); display: grid; place-items: center; font-family: var(--f-han); font-weight: 600; font-size: 13px; }
.bubble { max-width: min(78%, 520px); border-radius: 14px; padding: 10px 14px; min-width: 0; }
.npc .bubble { background: var(--npc); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
.me .bubble { background: var(--me); color: var(--me-fg); border-bottom-right-radius: 4px; }
.me.wrong .bubble { background: var(--cinnabar-soft); color: var(--fg); }
.me.wrong .han { text-decoration: line-through; text-decoration-color: var(--cinnabar); text-decoration-thickness: 2px; }
.me.okay .bubble { background: var(--ochre-soft); color: var(--fg); }
.han { font-family: var(--f-han); font-weight: 600; font-size: 21px; line-height: 1.4; }
.py { font-family: var(--f-py); font-size: 14px; opacity: 0.8; }
.en-line { font-size: 14px; margin-top: 2px; }
.reveal { background: none; border: none; padding: 0; font-size: 13px; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; }
.me .reveal { color: inherit; opacity: 0.75; }
.b-tools { display: flex; gap: 12px; align-items: center; margin-top: 4px; }
.say { background: none; border: none; padding: 2px; display: inline-flex; color: var(--muted); }
.me .say { color: inherit; opacity: 0.75; }
.say svg { width: 18px; height: 18px; }
body.no-py .py { display: none; }

/* Feedback cards: a seal stamp + what happened */
.fb { display: grid; grid-template-columns: auto minmax(0,1fr); gap: 12px 14px; align-items: start; border-radius: 12px; padding: 12px 14px; border: 1px solid; max-width: 640px; }
.fb.wrong { background: var(--cinnabar-soft); border-color: var(--cinnabar); }
.fb.okay { background: var(--ochre-soft); border-color: var(--ochre); }
.fb.good { background: var(--jade-soft); border-color: var(--jade); }
.seal { width: 48px; height: 48px; border-radius: 6px; display: grid; place-items: center; font-family: var(--f-han); font-weight: 900; font-size: 26px; color: var(--surface); transform: rotate(-6deg); line-height: 1; }
.fb.wrong .seal { background: var(--cinnabar); }
.fb.okay .seal { background: var(--ochre); font-size: 14px; }
.fb.good .seal { background: var(--jade); }
.fb .label { font-weight: 700; font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; }
.fb.wrong .label { color: var(--cinnabar); } .fb.okay .label { color: var(--ochre); } .fb.good .label { color: var(--jade); }
.fb p { margin: 2px 0 0; }
.why-btn { margin-top: 8px; border: 0; background: none; padding: 0; color: inherit; font-size: 13px; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; opacity: 0.8; }
.why-btn:hover { opacity: 1; }
.linkish { border: 0; background: none; padding: 0; font-size: 13px; font-weight: 600; color: var(--jade); text-decoration: underline; text-underline-offset: 3px; }
.why-out { margin-top: 8px; padding-top: 8px; border-top: 1px dashed currentColor; font-size: 14px; }
.why-tip { font-style: italic; }
.fb .better { margin-top: 6px; font-size: 14px; }
.fb .better .h { font-family: var(--f-han); font-weight: 600; font-size: 17px; }
.fb .better .p { font-family: var(--f-py); color: var(--muted); }

/* Your move */
.move { border-top: 1px solid var(--line); padding: 16px 20px 20px; display: flex; flex-direction: column; gap: 12px; }
.move-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.move-head h3 { margin: 0; font-size: 12px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); font-weight: 600; }
.prompt { font-size: 14px; color: var(--muted); }
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
.opt { text-align: left; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; transition: border-color .15s, transform .15s; }
.opt:hover { border-color: var(--fg); }
.opt:active { transform: translateY(1px); }
.opt[disabled] { opacity: 0.45; cursor: default; }
.opt .han { font-size: 19px; }
.opt .en-line { color: var(--muted); font-size: 13px; }
body.hint-off .opt .en-line { display: none; }
.opt .en { font-size: 16px; }
.free { display: flex; gap: 8px; flex-wrap: wrap; }
.free input { flex: 1 1 220px; min-width: 0; border: 1px solid var(--line); background: var(--bg); color: var(--fg); border-radius: 10px; padding: 10px 12px; font: 16px var(--f-py); }
.btn { border: 1px solid var(--fg); background: var(--fg); color: var(--bg); border-radius: 10px; padding: 9px 16px; font-weight: 600; }
.btn.ghost { background: transparent; color: var(--fg); border-color: var(--line); }
.btn[disabled] { opacity: 0.5; cursor: default; }
.free-note { font-size: 12px; color: var(--muted); margin: -4px 0 0; }
.endcard { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.ghost { align-self: center; font-size: 13px; color: var(--ochre); border: 1px dashed var(--ochre); border-radius: 999px; padding: 3px 12px; }
.ghost .han-inline { font-family: var(--f-han); font-weight: 600; text-decoration: line-through; }
.thinking { color: var(--muted); font-size: 14px; font-style: italic; }

/* Notebook */
.notebook { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.nb-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.nb-title { font-family: var(--f-han); font-weight: 900; font-size: 22px; }
.nb-sub { font-size: 13px; color: var(--muted); margin: 0; }
.nb-count { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--cinnabar); }
.nb-list { display: flex; flex-direction: column; gap: 8px; max-height: 70vh; overflow-y: auto; }
.nb-item { border-top: 1px dashed var(--line); padding-top: 8px; font-size: 14px; }
.nb-item .where { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.nb-item .said { font-family: var(--f-han); text-decoration: line-through; text-decoration-color: var(--cinnabar); }
.nb-item .said.okay { text-decoration-color: var(--ochre); }
.nb-item .fix { font-family: var(--f-han); font-weight: 600; }
.nb-item .fixpy { font-family: var(--f-py); color: var(--muted); font-size: 13px; }
.nb-item .why { color: var(--muted); font-size: 13px; }
.nb-empty { color: var(--muted); font-size: 14px; }
.nb-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.patterns { display: flex; flex-direction: column; gap: 6px; padding: 10px 0 4px; border-top: 1px solid var(--line); }
.pt-title { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
.pt-row { display: grid; grid-template-columns: auto minmax(0,1fr) auto; gap: 2px 8px; align-items: baseline; text-align: left; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 6px 8px; }
.pt-row:hover { border-color: var(--fg); }
.pt-zh { font-family: var(--f-han); font-weight: 900; color: var(--cinnabar); }
.pt-en { font-size: 13px; font-weight: 600; }
.pt-n { font-size: 12px; color: var(--muted); }
.pt-bar { grid-column: 1 / -1; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
.pt-bar i { display: block; height: 100%; background: var(--cinnabar); border-radius: 2px; }
.pt-hint { font-size: 12px; color: var(--muted); }
.small { font-size: 13px; padding: 6px 10px; }
.scn.review { border-style: dashed; }
.rail .rail-sub { margin-top: 10px; }
.pb { display: flex; flex-direction: column; gap: 6px; }
.pb-title { margin: 6px 0 0; font-size: 12px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); font-weight: 600; }
.pb-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; border-top: 1px dashed var(--line); padding-top: 6px; }
.pb-row .han { font-size: 18px; }
.pb-tools { display: flex; gap: 6px; align-items: center; flex: 0 0 auto; }
.pb.hard .pb-title { color: var(--cinnabar); }
.pb-hear { border-top: 1px dashed var(--line); padding-top: 6px; font-size: 14px; }
.pb-hear summary { cursor: pointer; color: var(--muted); font-size: 13px; font-weight: 600; }
.pb-heard { display: flex; flex-wrap: wrap; gap: 2px 10px; padding: 4px 0; }
.pb-heard .han { font-family: var(--f-han); }
.show-local { position: fixed; inset: 0; z-index: 50; background: var(--bg); color: var(--fg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px 16px; text-align: center; overflow-y: auto; }
.sl-han { font-family: var(--f-han); font-weight: 900; font-size: clamp(40px, 11vw, 120px); line-height: 1.15; max-width: 14em; overflow-wrap: anywhere; }
.sl-py { font-family: var(--f-py); font-size: clamp(16px, 3vw, 24px); color: var(--muted); }
.sl-en { font-size: 15px; color: var(--muted); }
.sl-reply { margin-top: 10px; border-top: 1px dashed var(--line); padding-top: 14px; max-width: 36em; }
.sl-label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--jade); font-weight: 600; }
.sl-rhan { font-family: var(--f-han); font-size: clamp(22px, 5vw, 40px); margin-top: 6px; }
.sl-ren { font-size: 14px; color: var(--muted); }
.sl-tools { display: flex; gap: 8px; margin-top: 8px; }
.modes { display: flex; gap: 6px; flex-wrap: wrap; }
.build { display: flex; flex-direction: column; gap: 10px; }
.slots { min-height: 52px; border: 1px dashed var(--line); border-radius: 10px; padding: 8px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; background: var(--bg); }
.slots-empty { color: var(--muted); font-size: 14px; padding-inline: 4px; }
.bank { display: flex; flex-wrap: wrap; gap: 8px; }
.tile { font-family: var(--f-han); font-weight: 600; font-size: 19px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 12px; }
.tile:hover { border-color: var(--fg); }
.tile.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.scn.review .han { color: var(--cinnabar); }
.ear { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.ear-label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); font-weight: 600; }
.fb .cost { margin-top: 6px; font-size: 13px; font-weight: 600; color: var(--cinnabar); }
.outcome { border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; background: var(--bg); }
.outcome p { margin: 4px 0 0; font-size: 14px; color: var(--muted); }
.outcome-title { font-size: 12px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--cinnabar); font-weight: 700; }
.outcome ul { margin: 6px 0 0; padding-left: 18px; }
.outcome li { font-weight: 600; }
.nb-item .where { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }
.nb-item .when { margin-left: auto; text-transform: none; letter-spacing: 0; font-size: 12px; }
.dots { display: inline-flex; gap: 3px; }
.dots i { width: 7px; height: 7px; border-radius: 50%; border: 1px solid var(--jade); display: inline-block; }
.dots i.on { background: var(--jade); }
.nb-item.learned { opacity: 0.55; }
.nb-item.learned .said { text-decoration-color: var(--jade); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div>
      <div class="brand"><h1>街头中文</h1><span class="en">Street Mandarin</span></div>
      <p class="tagline">No lessons. Walk into a real situation, say something, get it wrong, and learn from how people react.</p>
      <p class="streak" id="streak" aria-live="polite"></p>
    </div>
    <div class="toggles" role="group" aria-label="Display options">
      <button class="chip" id="tg-py" aria-pressed="true">Pinyin</button>
      <button class="chip" id="tg-hint" aria-pressed="false">English on answers</button>
      <button class="chip" id="tg-listen" aria-pressed="false" title="Hear lines first; the text appears after you answer">Listening mode</button>
    </div>
  </header>

  <div class="layout">
    <nav class="rail" id="rail" aria-label="Situations"><h2>Practice</h2></nav>

    <main class="scene" id="scene">
      <div class="scene-head">
        <div class="place" id="place"></div>
        <div class="place-py" id="place-py"></div>
        <div class="place-en" id="place-en"></div>
        <div class="goal" id="goal"></div>
      </div>
      <div class="log" id="log" aria-live="polite"></div>
      <section class="move" id="move"></section>
    </main>

    <aside class="notebook" aria-label="Mistake notebook">
      <div class="nb-head"><span class="nb-title">错题本</span><span class="nb-count" id="nb-count">0</span></div>
      <p class="nb-sub"><span style="font-family:var(--f-py)">cuòtíběn</span>, the mistake notebook every Chinese student keeps. Everything you got wrong lands here, then comes back to test you after 1, 3 and 7 days.</p>
      <div id="nb-patterns"></div>
      <div class="nb-list" id="nb-list"></div>
      <div class="nb-actions" id="nb-actions"></div>
    </aside>
  </div>
</div>

<script src="scenes.js"></script>
<script>
const S = window.SCENES;

/* ---------- storage (per-viewer convenience only) ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
let notebook = store.get("sm-notebook", []);
let done = store.get("sm-done", {});
let days = store.get("sm-days", []), said = store.get("sm-said", 0);
const dayKey = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
function streakLen() {
  const set = new Set(days); let n = 0; const d = new Date();
  if (!set.has(dayKey(d))) d.setDate(d.getDate() - 1); // yesterday still counts until today is over
  while (set.has(dayKey(d))) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
function renderStreak() {
  const box = document.getElementById("streak"); if (!box) return;
  box.textContent = "";
  if (!said) return;
  const n = streakLen();
  if (n > 1) box.append(el("span", "zh", `连续${n}天`), `${n} days in a row · `);
  else if (n === 1) box.append(el("span", "zh", "今天练了"), "Practised today · ");
  box.append(plural(said, "line") + " answered so far");
}
function practised() {
  said++; store.set("sm-said", said);
  const k = dayKey(); if (!days.includes(k)) { days.push(k); days = days.slice(-60); store.set("sm-days", days); }
  renderStreak();
}
let prefs = Object.assign({ py: true, hint: false, listen: false, how: "pick" }, store.get("sm-prefs", {}));
if (prefs.build === true && !store.get("sm-prefs", {}).how) prefs.how = "build";

/* ---------- state ---------- */

/* ---------- scenes ---------- */
function start(id) {
  mode = "scene";
  const base = S.find(s => s.id === id);
  turn = 0; finished = false; transcript = []; busy = false; flags = {}; outcomes = []; curveball = null; runMisses = []; runMissTags = []; lastGained = [];

  const turns = base.turns.map((t, i) => Object.assign({}, t, { _orig: i }));
  if (done[id] && base.curveballs && base.curveballs.length && Math.random() < 0.6) {
    const ci = Math.floor(Math.random() * base.curveballs.length), cb = base.curveballs[ci];

const moveKey = t => t._cb != null ? "c" + t._cb : "t" + t._orig;

/* ---------- type (or say) it: production with no options on screen ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let micBroken = false;
const normHan = x => x.replace(/[\s，。！？、,.!?…“”"'：:；;（）()]/g, "");

  for (let i = 1; i <= a.length; i++) {
    const row = [i];
    for (let j = 1; j <= b.length; j++) row.push(Math.min(prev[j] + 1, row[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)));

}
function typer(t) {

  const form = el("form", "free");
  const inp = el("input"); inp.id = "type-input"; inp.type = "text"; inp.autocomplete = "off"; inp.lang = "zh-CN";
  inp.placeholder = "Type it in characters or pinyin (tones optional)";

function listenOnce(inp, mic, done) {

  mic.textContent = "Listening…"; mic.disabled = true;

  rec.onerror = e => {
    if (e.error === "not-allowed" || e.error === "service-not-allowed" || e.error === "audio-capture") { micBroken = true; addNarr("The microphone isn't available here, so type your answer instead."); }
    renderMove();

function submitTyped(text, t) {
  if (busy || !text) return;
  const h = normHan(text), py = normPy(text);
  const hit = t.opts.find(o => normHan(o.h) === h) || (py && t.opts.find(o => normPy(o.p) === py));
  if (hit) return choose(hit);
  const good = t.opts.find(o => o.k === "good");
  const near = t.opts.filter(o => o.k === "good").find(o => {
    const d = /[\u4e00-\u9fff]/.test(text) ? lev(h, normHan(o.h)) : lev(py, normPy(o.p));
    return d > 0 && d <= Math.max(1, Math.floor((/[\u4e00-\u9fff]/.test(text) ? normHan(o.h).length : normPy(o.p).length) / 8));
  });
  if (near) {
    addMe(text, "", "", "okay");
    addFeedback("okay", "Almost. One small slip, but they'd get what you mean.", [near.h, near.p]);
    logMistake({ sid: cur.id, ...turnRef(), kind: "okay", said: text, fix: near.h, fixPy: near.p, why: "Typed answer was one small slip away." });
    return choose(Object.assign({}, near, { quiet: true }));
  }
  if (sample) return offScript(text);
  addMe(text, "", "", "wrong");
  addFeedback("wrong", "That isn't something a local would follow here. Here's one way to say it. Try typing it yourself.", [good.h, good.p]);
  logMistake({ sid: cur.id, ...turnRef(), kind: "wrong", said: text, fix: good.h, fixPy: good.p, why: "Typed answer didn't fit this moment." });
  renderMove();
}

/* ---------- build mode: put the words in order yourself ---------- */
let bState = null; // { key, ans, tiles, chosen }
function builder(t, good) {
  const key = cur.id + ":" + turn;
  if (!bState || bState.key !== key) {
    const ans = good.b.split("|");
    const pool = [...new Set(cur.turns.flatMap(x => x.opts.filter(o => o.b).flatMap(o => o.b.split("|"))))].filter(w => !ans.includes(w));
    const extra = shuffle(pool).slice(0, 2);
    bState = { key, ans, tiles: shuffle(ans.concat(extra)).map((w, i) => ({ w, i })), chosen: [] };
  }
  const box = el("div", "build");
  const slots = el("div", "slots"); slots.setAttribute("aria-label", "Your sentence");
  if (!bState.chosen.length) slots.append(el("span", "slots-empty", "Tap the words in order"));
  bState.chosen.forEach(tile => {
    const b = el("button", "tile on", tile.w); b.disabled = busy;
    b.onclick = () => { bState.chosen = bState.chosen.filter(x => x !== tile); renderMove(); };
    slots.append(b);
  });
  const bank = el("div", "bank");
  bState.tiles.filter(x => !bState.chosen.includes(x)).forEach(tile => {
    const b = el("button", "tile", tile.w); b.disabled = busy;
    b.onclick = () => { bState.chosen.push(tile); renderMove(); };
    bank.append(b);
  });
  const row = el("div", "endcard");
  const check = el("button", "btn", "Say it"); check.disabled = busy || !bState.chosen.length;
  check.onclick = () => checkBuild(good);
  const clear = el("button", "btn ghost", "Start over"); clear.disabled = !bState.chosen.length;
  clear.onclick = () => { bState.chosen = []; renderMove(); };
  row.append(check, clear);
  box.append(slots, bank, row);
  return box;
}
function checkBuild(good) {
  const built = bState.chosen.map(x => x.w), ans = bState.ans;
  bState = null;
  if (built.join("|") === ans.join("|")) return choose(good);
  const sameWords = built.length === ans.length && [...built].sort().join() === [...ans].sort().join();
  const why = sameWords ? "Right words, wrong order. Word order carries a lot of the meaning in Chinese." :
    built.length < ans.length && built.every(w => ans.includes(w)) ? "Close, but something's missing." :
    "Some of those words don't belong in this answer.";
  addMe(built.join(""), "", "", "wrong");
  addFeedback("wrong", why, [good.h, good.p]);
  logMistake({ sid: cur.id, ...turnRef(), kind: "wrong", said: built.join(""), fix: good.h, fixPy: good.p, why });
  renderMove();

    b.onclick = () => onPick(o);

function clearGhost() {

function choose(o) {

  if (o.quiet) return advance();

  addFeedback(o.k, o.note, o.fix, o.carry ? { label: "Didn't land, and it stuck", cost: "This one carries on. You'll see what it cost at the end." } : null);

const DAY = 864e5, GAPS = [1, 3, 7]; // days until a mistake comes back; 3 right answers and it's learned

    const t = cur.turns[turn];

  }
  const same = notebook.find(n => !n.learned && n.sid === entry.sid && n.said === entry.said);

}

let rq = [], ri = 0, rRight = 0, rLearned = 0, rAnswered = false, rReveal = false;

}

/* ---------- prices by ear: a quick drill on the numbers that trip people up ---------- */
const ZH = ["零", "一", "二", "三", "四", "五", "六", "七", "八", "九"], PY = ["líng", "yī", "èr", "sān", "sì", "wǔ", "liù", "qī", "bā", "jiǔ"];
function priceWords(n) {
  // Spoken the way a cashier says it: 一百五 for 150, 一百零五 for 105, 两百 for 200, 十二块五 for 12.5
  const whole = Math.floor(n), half = n % 1 !== 0;
  const h = Math.floor(whole / 100), t = Math.floor(whole / 10) % 10, o = whole % 10;
  let zh = "", py = [];
  if (h) { zh += (h === 2 ? "两" : ZH[h]) + "百"; py.push((h === 1 ? "yì" : h === 2 ? "liǎng" : PY[h]) + "bǎi"); }
  if (h && !t && o) { zh += "零" + ZH[o]; py.push("líng " + PY[o]); }
  else if (h && t && !o) { zh += ZH[t]; py.push(PY[t]); }
  else if (t) {
    zh += (t === 1 && !h ? "" : ZH[t]) + "十" + (o ? ZH[o] : "");
    py.push((t === 1 && !h ? "" : PY[t]) + "shí" + (o ? PY[o] : ""));
  } else if (!h) { zh += ZH[o]; py.push(PY[o]); }
  if (!(h && t && !o && !half)) { zh += "块" + (half ? "五" : ""); py.push("kuài" + (half ? " wǔ" : "")); } // 一百五, not 一百五块
  return { zh, py: py.join(" ").replace(/\s+/g, " ").trim().replace(/([a-zü\u00c0-\u024f])èr/g, "$1'èr") };
}
const PRICES = [8, 12, 13, 14, 15, 16, 18, 19, 24, 25, 30, 32, 40, 42, 45, 50, 60, 68, 80, 88, 99, 105, 108, 120, 150, 240, 8.5, 12.5, 36.5];
function priceTip(n, got) {
  const teen = (x, y) => x > 10 && x < 20 && y === (x - 10) * 10;
  if (teen(n, got) || teen(got, n)) return "Order matters: 十 shí after a number multiplies (八十 = 80), before it adds (十八 = 18).";
  if (n > 20 && n < 100 && got === (n % 10) * 10 + Math.floor(n / 10)) return "Read it in order: 四十二 is four-ten-two, so 42.";
  if (n % 1 && Math.floor(n) === got) return "The 五 after 块 is half a yuan: 块五 = .50.";
  if (n >= 100 && n % 10 === 0 && got === Math.floor(n / 100) * 100 + (n % 100) / 10) return "一百五 is short for 一百五十 (150). 105 would be 一百零五, with a 零.";
  if (n > 100 && n % 100 < 10 && got === Math.floor(n / 100) * 100 + (n % 100) * 10) return "零 líng marks the empty tens: 一百零五 = 105. Without it, 一百五 = 150.";
  return "Listen for where 十 shí and 百 bǎi sit, then build the number piece by piece.";
}

function startPhrasebook() {
  mode = "phrases"; busy = false;
  setHead("短语", "duǎnyǔ", "Your phrasebook", "What's here: ", "Lines that worked, from every place you've survived. Search it, hear it, or tap Show to hand your phone to someone.");
  renderPhrases();
  renderRail(); renderMove();
}
function renderPhrases() {
  const log = $("#log"); log.textContent = "";
  const q = pbQuery.trim().toLowerCase(), qPy = normPy(q);
  const hit = o => !q || o.h.includes(q) || o.e.toLowerCase().includes(q) || (qPy && normPy(o.p).includes(qPy));
  // Lines learned the hard way: the fixes for mistakes still in your notebook
  const hard = []; const seen = new Set();
  activeItems().forEach(n => { if (n.fix && !seen.has(n.fix)) { seen.add(n.fix); hard.push({ h: n.fix, p: n.fixPy || "", e: n.why ? n.why.split(/(?<=\.)\s/)[0] : "" }); } });
  const hardHits = hard.filter(o => !q || o.h.includes(q) || (qPy && normPy(o.p).includes(qPy)) || o.e.toLowerCase().includes(q));
  if (hardHits.length) {
    const sec = el("section", "pb hard");
    sec.append(el("h4", "pb-title", "Learned the hard way"));
    hardHits.slice(0, 8).forEach(o => sec.append(phraseRow(o, null)));
    log.append(sec);
  }
  const places = S.filter(s => done[s.id]);
  if (!places.length && !hard.length) addNarr("Nothing here yet. Survive your first place and its lines land here.");
  let shown = 0;
  places.forEach(s => {
    const rows = [];
    s.turns.forEach((t, ti) => t.opts.filter(o => o.k === "good" && hit(o)).forEach(o => rows.push(phraseRow(o, replyAfter(s, ti)))));
    if (!rows.length) return;
    const sec = el("section", "pb");
    sec.append(el("h4", "pb-title", `${s.place} · ${s.en}`), ...rows);
    if (!q) {
      // The other half of the conversation: what people there say to you
      const hear = el("details", "pb-hear");
      hear.append(el("summary", null, "What you'll hear there"));
      s.turns.filter(t => t.npc).forEach(t => { const r = el("div", "pb-heard"); r.append(el("span", "han", t.npc[0]), el("span", "en-line", t.npc[2])); hear.append(r); });
      sec.append(hear);
    }
    shown += rows.length; log.append(sec);
  });
  if (q && !shown && !hardHits.length) addNarr(`Nothing matches "${pbQuery}" yet. Survive more places to fill the phrasebook.`);
  log.scrollTop = 0;
}
function showLocal(o, reply) {
  // Full screen, big characters: for pointing at, or handing your phone over
  const ov = el("div", "show-local"); ov.setAttribute("role", "dialog"); ov.setAttribute("aria-label", "Phrase shown big");
  const close = () => { ov.remove(); document.removeEventListener("keydown", onKey); };
  const onKey = ev => { if (ev.key === "Escape") close(); };
  const big = el("div", "sl-han", o.h);
  const py = el("div", "sl-py", o.p);
  const en = el("div", "sl-en", o.e);
  const row = el("div", "sl-tools");
  if (canSpeak) { const b = el("button", "btn", "Play it"); b.onclick = ev => { ev.stopPropagation(); speak(o.h, 0.8); }; row.append(b); }
  const x = el("button", "btn ghost", "Close"); x.onclick = close; row.append(x);
  ov.append(big, py, en);
  if (reply) {
    const r = el("div", "sl-reply");
    r.append(el("div", "sl-label", "They'll probably answer something like"), el("div", "sl-rhan", reply[0]), el("div", "sl-ren", reply[2]));
    ov.append(r);
  }
  ov.append(row);
  document.body.append(ov); document.addEventListener("keydown", onKey);
  x.focus();
}
function renderPhrasesMove() {
  const m = $("#move"); m.textContent = "";
  const n = S.filter(s => done[s.id]).reduce((a, s) => a + s.turns.reduce((b, t) => b + t.opts.filter(o => o.k === "good").length, 0), 0);
  const head = el("div", "move-head");
  head.append(el("h3", null, plural(n, "phrase")), el("span", "prompt", `From ${plural(S.filter(s => done[s.id]).length, "place")} of ${S.length}.`));
  const form = el("form", "free");
  const inp = el("input"); inp.type = "search"; inp.autocomplete = "off"; inp.value = pbQuery;
  inp.placeholder = "Find a line: \"toilet\", \"duoshao\", 谢谢…"; inp.setAttribute("aria-label", "Search the phrasebook");
  inp.oninput = () => { pbQuery = inp.value; renderPhrases(); };
  form.onsubmit = ev => ev.preventDefault();
  form.append(inp);
  const back = el("button", "btn ghost", "Back to the situations"); back.onclick = () => start(lastScene());
  const row = el("div", "endcard"); row.append(back);
  m.append(head, form, row);
}

/* ---------- wander: Claude makes up a fresh everyday situation and plays it out ---------- */
let wTranscript = [], wDone = false, wGoal = false;
async function startWander(theme) {
  if (!sample) return;
  mode = "wander"; busy = true; wDone = false; wGoal = false; wTranscript = []; outcomes = [];
  setHead("随便逛", "suíbiàn guàng", "Wander", "How it works: ", "Claude invents an everyday situation you haven't practised. Say whatever you'd say; there are no options.");
  $("#log").textContent = ""; addNarr("Setting the scene…");
  renderRail(); renderMove();
  const known = S.map(s => s.en).join(", ");
  const prompt = `Invent one short, realistic everyday situation a foreign visitor might face in mainland China, for a beginner Mandarin learner to role-play. ${theme ? `The learner asked for this situation: "${String(theme).slice(0, 120)}". Build the scene around it if it's a reasonable everyday situation.` : `Avoid these, which they've already practised: ${known}.`} Good ideas: returning a wrong item, asking a neighbour to keep the noise down, a courier delivering a package, buying fruit by the jin, a pharmacy for mosquito bites, asking to charge your phone, a photo request from strangers, a delayed train announcement.
Return ONLY a JSON object with keys:
"place_hanzi" (2 to 4 characters), "place_pinyin", "place_english" (2 to 4 words),
"who_hanzi" (role, 2 to 3 characters), "who_english" (e.g. "the courier"),
"goal" (one plain-English sentence: what the learner must achieve),
"intro" (one or two plain-English sentences setting the scene),
"opening_hanzi" (what the other person says first, short spoken simplified Chinese a beginner can follow), "opening_pinyin" (tone marks), "opening_english".`;
  try {
    const r = await sample.json(prompt, { cache: false, modelTier: "quick" });
    cur = { id: "wander", place: r.place_hanzi, placePy: r.place_pinyin, en: r.place_english, who: String(r.who_hanzi || "路人").slice(0, 2), whoEn: r.who_english || "the local", goal: r.goal, intro: r.intro, turns: [] };
    setHead(cur.place, cur.placePy, cur.en, "Your goal: ", cur.goal);
    $("#log").textContent = ""; addNarr(cur.intro);
    addNpc([r.opening_hanzi, r.opening_pinyin, r.opening_english]);
    wTranscript.push({ who: "npc", text: r.opening_hanzi });
  } catch (e) {
    $("#log").textContent = "";
    addNarr(e && e.code === "not_granted" ? "Wander needs permission to use Claude. The places on the left still work without it." : "Couldn't set the scene that time. Try Wander again in a moment.");
    if (e && e.code === "not_granted") sample = null;
    wDone = true;
  }
  busy = false; renderRail(); renderMove();
}
function renderWanderMove() {
  const m = $("#move"); m.textContent = "";
  const head = el("div", "move-head");
  if (wDone) {
    head.append(el("h3", null, wGoal ? (outcomes.length ? "You made it, at a price" : "You made it") : "Scene over"));
    const row = el("div", "endcard");
    if (sample) { const again = el("button", "btn", "Wander somewhere else"); again.onclick = () => startWander(); row.append(again); }
    const back = el("button", "btn ghost", "Back to the situations"); back.onclick = () => start(lastScene());
    row.append(back); m.append(head, row);
    if (sample) {
      const form = el("form", "free");
      const inp = el("input"); inp.type = "text"; inp.autocomplete = "off"; inp.maxLength = 120;
      inp.placeholder = "Or name a situation: buying shoes, a noisy neighbour…"; inp.setAttribute("aria-label", "A situation to practise");
      const go = el("button", "btn ghost", "Go there"); go.type = "submit";
      form.append(inp, go);
      form.onsubmit = ev => { ev.preventDefault(); const v = inp.value.trim(); if (v) startWander(v); };
      m.append(form);
    }
    return;
  }
  head.append(el("h3", null, "Your move"), el("span", "prompt", "No options here. Say what you'd really say."));
  const form = el("form", "free");
  const inp = el("input"); inp.id = "wander-input"; inp.type = "text"; inp.autocomplete = "off"; inp.lang = "zh-CN"; inp.disabled = busy;
  inp.placeholder = busy ? "…" : "Characters, pinyin, or English if you're stuck";
  inp.setAttribute("aria-label", "What you say");
  const send = el("button", "btn", busy ? "…" : "Say it"); send.type = "submit"; send.disabled = busy;
  form.append(inp, send);
  if (SR && !micBroken) {
    const mic = el("button", "btn ghost", "Speak"); mic.type = "button"; mic.disabled = busy;
    mic.onclick = () => listenOnce(inp, mic, () => { const v = inp.value.trim(); if (v) wanderSay(v); });
    form.append(mic);
  }
  form.onsubmit = ev => { ev.preventDefault(); const v = inp.value.trim(); if (v) wanderSay(v); };
  const end = el("button", "btn ghost small", "End the scene"); end.type = "button"; end.onclick = () => { wDone = true; renderMove(); };
  const row = el("div", "endcard"); row.append(end);
  m.append(head, form, row);
  setTimeout(() => { try { inp.focus({ preventScroll: true }); } catch {} }, 0);
}
async function wanderSay(text) {
  if (busy) return;
  busy = true;
  addMe(text, "", "", "good");
  wTranscript.push({ who: "me", text });
  const think = el("div", "thinking", cur.whoEn.replace(/^./, c => c.toUpperCase()) + " is thinking…"); $("#log").append(think); scrollLog();
  renderMove();
  const history = wTranscript.slice(-14).map(x => (x.who === "npc" ? cur.who + ": " : "Learner: ") + x.text).join("\n");
  const prompt = `You are role-playing ${cur.whoEn} (${cur.who}) in mainland China. Situation: ${cur.en}. ${cur.intro} The learner, a beginner in Mandarin, has this goal: ${cur.goal}

Conversation so far:
${history}

The learner just said: "${text}" (they may write hanzi, pinyin with or without tones, or English if stuck).

Reply in character like a real local: one or two short, natural spoken sentences in simplified Chinese a beginner can follow. React to what they literally said, including confusion or a realistic consequence if it was wrong (agreeing to something by accident sticks). Never lecture in character. Then step out of character to coach.

Return ONLY a JSON object:
"npc_hanzi", "npc_pinyin" (tone marks), "npc_english",
"verdict": "good" | "okay" | "wrong" (wrong if a local would misunderstand, or if they used only English),
"note": one or two plain-English sentences on what worked or exactly what went wrong, naming the key word with pinyin,
"better_hanzi", "better_pinyin": a natural way to say what they meant (empty strings if good),
"consequence": a short plain-English phrase if their mistake cost them something that sticks (e.g. "Paid 20 kuai too much"), else "",
"goal_reached": true only if the learner has now fully achieved the goal.`;
  try {
    const r = await sample.json(prompt, { cache: false, modelTier: "quick" });
    think.remove();
    const kind = ["good", "okay", "wrong"].includes(r.verdict) ? r.verdict : "okay";
    if (r.npc_hanzi) { addNpc([r.npc_hanzi, r.npc_pinyin || "", r.npc_english || ""]); wTranscript.push({ who: "npc", text: r.npc_hanzi }); }
    addFeedback(kind, r.note || "", r.better_hanzi ? [r.better_hanzi, r.better_pinyin || ""] : null, r.consequence ? { label: "Didn't land, and it stuck", cost: r.consequence } : null);
    if (r.consequence) outcomes.push(r.consequence);
    if (kind !== "good") logMistake({ sid: "wander", turn: null, kind, said: text, fix: r.better_hanzi || "", fixPy: r.better_pinyin || "", why: (cur.en ? cur.en + ": " : "") + (r.note || "") });
    if (r.goal_reached === true) { wDone = wGoal = true; addNarr(outcomes.length ? "Goal reached, though it cost you: " + outcomes.join("; ") + "." : "Goal reached. Clean run."); }
  } catch (e) {
    think.remove();
    addNarr(e && e.code === "rate_limited" ? "Too many messages at once. Wait a moment, then try again." : "That didn't go through. Try saying it again.");
    wTranscript.pop();
  }
  busy = false; renderMove();
}

/* ---------- off-script with Claude ---------- */
let sample = null;
function renderFree(m) {
  if (!sample || mode !== "scene") return;
  const form = el("form", "free");
  const inp = el("input"); inp.id = "free-input"; inp.type = "text"; inp.autocomplete = "off";
  inp.placeholder = finished ? "Keep chatting with " + cur.whoEn + "…" : "Or say it your own way: hanzi, pinyin, even English";
  inp.setAttribute("aria-label", "Say it your own way");
  const send = el("button", "btn", busy ? "…" : "Say it"); send.type = "submit"; send.disabled = busy; inp.disabled = busy;
  form.append(inp, send);
  form.onsubmit = ev => { ev.preventDefault(); const v = inp.value.trim(); if (v) offScript(v); };
  m.append(form, el("p", "free-note", "Off-script replies come from Claude playing " + cur.whoEn + ", and use your Claude account."));
}

async function offScript(text) {
  if (busy) return;
  busy = true;
  addMe(text, "", "", "good");
  const think = el("div", "thinking", cur.whoEn.replace(/^./, c => c.toUpperCase()) + " is thinking…"); $("#log").append(think); scrollLog();
  renderMove();
  const t = finished ? null : cur.turns[turn];
  const goodOnes = t ? t.opts.filter(o => o.k === "good").map(o => o.h).join(" / ") : "";
  const history = transcript.slice(-12).map(x => (x.who === "npc" ? cur.who + ": " : "Learner: ") + x.text).join("\n");
  const prompt = `You are role-playing a ${cur.whoEn} (${cur.who}) in mainland China, in this situation: ${cur.en}. A beginner Mandarin learner is practising real-life survival Chinese by talking to you. The learner's goal: ${cur.goal}
${t ? `Right now you just asked or said: "${t.npc ? t.npc[0] : "(nothing yet; the learner is approaching you)"}". The learner's task at this step: ${t.prompt}. Examples of replies that complete this step: ${goodOnes}.` : "The main task is already done; just keep chatting naturally in character."}

Conversation so far:
${history}

The learner just said: "${text}"
(They may write hanzi, pinyin with or without tones, or even English if they don't know the words.)

Respond in character, the way a real local would: short, natural, spoken Mandarin a beginner can follow (one or two short sentences, simplified characters). React realistically to what they literally said, including confusion if it was wrong or unclear; never lecture in character. Then step out of character to coach.

Return ONLY a JSON object with these keys:
"npc_hanzi": your in-character reply in simplified Chinese,
"npc_pinyin": its pinyin with tone marks,
"npc_english": its English translation,
"verdict": "good" if a local would understand and it was natural, "okay" if understood but unnatural or grammatically off, "wrong" if a local would misunderstand or it doesn't fit (also use "wrong" if they wrote only English),
"advance": ${t ? "true if what they said accomplishes this step's task (verdict good or okay), else false" : "false"},
"note": one or two plain-English sentences for the learner explaining what worked or exactly what went wrong and why, mentioning the key word with its pinyin,
"better_hanzi": a natural way to say what they meant (empty string if verdict is good),
"better_pinyin": its pinyin with tone marks (empty string if verdict is good).
If "advance" is true, keep npc_hanzi to a brief acknowledgement (like 好的 or 行), because your next scripted line follows.`;
  try {
    const r = await sample.json(prompt, { cache: false, modelTier: "quick" });
    think.remove();
    const kind = ["good", "okay", "wrong"].includes(r.verdict) ? r.verdict : "okay";
    if (r.npc_hanzi) addNpc([r.npc_hanzi, r.npc_pinyin || "", r.npc_english || ""]);
    addFeedback(kind, r.note || "", r.better_hanzi ? [r.better_hanzi, r.better_pinyin || ""] : null);
    if (kind !== "good") logMistake({ sid: cur.id, ...(t ? turnRef() : { turn: null }), kind, said: text, fix: r.better_hanzi || "", fixPy: r.better_pinyin || "", why: r.note || "" });
    busy = false;
    if (t && r.advance === true && kind !== "wrong") advance(); else renderMove();
  } catch (e) {
    think.remove(); busy = false;
    const msg = e && e.code === "not_granted" ? "Off-script talk needs permission to use Claude. The scripted answers still work." :
      e && e.code === "rate_limited" ? "Too many messages at once. Wait a moment, then try again." :
      "That didn't go through. Try saying it again.";
    addNarr(msg);
    if (e && e.code === "not_granted") sample = null;
    renderMove();
  }
}

/* ---------- toggles ---------- */
function applyPrefs() {
  document.body.classList.toggle("no-py", !prefs.py);
  document.body.classList.toggle("hint-off", !prefs.hint);
  $("#tg-py").setAttribute("aria-pressed", prefs.py);
  $("#tg-hint").setAttribute("aria-pressed", prefs.hint);
  $("#tg-listen").setAttribute("aria-pressed", prefs.listen);
  $("#tg-listen").hidden = !canSpeak;
}
$("#tg-py").onclick = () => { prefs.py = !prefs.py; store.set("sm-prefs", prefs); applyPrefs(); };
$("#tg-hint").onclick = () => { prefs.hint = !prefs.hint; store.set("sm-prefs", prefs); applyPrefs(); };
$("#tg-listen").onclick = () => { prefs.listen = !prefs.listen; store.set("sm-prefs", prefs); applyPrefs(); };

// Keys 1–9 pick an answer; Enter moves on when there's a single next step
document.addEventListener("keydown", ev => {
  if (ev.ctrlKey || ev.metaKey || ev.altKey || ev.isComposing) return;
  const t = ev.target; if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;
  if (/^[1-9]$/.test(ev.key)) {
    const o = document.querySelectorAll("#move .opt:not([disabled])")[+ev.key - 1];
    if (o) { ev.preventDefault(); o.click(); }
  } else if (ev.key === "Enter" && t === document.body) {
    const b = document.querySelector("#move .endcard .btn:not(.ghost)");
    if (b && !document.querySelector("#move .opt")) { ev.preventDefault(); b.click(); }
  }
});
applyPrefs(); renderNotebook(); renderStreak();
let last = null; try { last = localStorage.getItem("sm-last"); } catch {}
start(S.some(s => s.id === last) ? last : S[0].id);

(async () => {
  try { if (window.claude && claude.use) { const s = await claude.use("sample"); if (s) { sample = s; renderRail(); renderMove(); } } } catch {}
})();
</script>
